description: 'Capella University is an accredited online university owned by Strategic
  Education, Inc. (SEI), offering competency-based bachelor''s, master''s, and doctoral
  degrees plus graduate certificates across business, counseling and therapy, education,
  health sciences, information technology, nursing, psychology, and social work. Capella
